services:
  - type: web
    name: topic-modeling-dashboard
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0" # Forces playwright to install in local node_modules/python cache rather than system root
