[server]
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 200
runOnSave = true

[theme]
base = "light"
primaryColor = "#1e293b"
backgroundColor = "#fafaf9"
secondaryBackgroundColor = "#f5f5f4"
textColor = "#1c1917"
font = "sans serif"

[browser]
gatherUsageStats = false
